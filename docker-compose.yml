# docker-compose.yml
# Orchestrates MongoDB, Node.js API server, and Nginx frontend for one-command deployment
services:
  mongo:
    image: mongo:7.0
    container_name: exam_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: exam_proctoring
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: exam_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/exam_proctoring
      CLIENT_URL: http://localhost
      JWT_ACCESS_SECRET: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      JWT_REFRESH_SECRET: 8a70c0c7fae987c8d929427b3b4f981e4b01e3b2b93478d10b754388e6a32d18
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: exam_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
    driver: local
